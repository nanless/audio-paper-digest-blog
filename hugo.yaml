baseURL: "https://nanless.github.io/audio-paper-digest-blog/"
languageCode: "zh-CN"
hasCJKLanguage: true
defaultContentLanguage: "zh-CN"
timeZone: "Asia/Shanghai"
title: "语音/音乐/音频论文速递"
theme: "PaperMod"

languages:
  zh-CN:
    languageCode: "zh-CN"
    languageName: "简体中文"
    weight: 1

pagination:
  pagerSize: 20
enableGitInfo: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false

minify:
  disableXML: true

menu:
  main:
    - name: "首页"
      url: "/"
      weight: -1
    - name: "论文库"
      url: "/papers/"
      weight: 1
    - name: "搜索"
      url: "/search/"
      weight: 2
    - name: "归档"
      url: "/archives/"
      weight: 3
    - name: "研究方向"
      url: "/tags/"
      weight: 4
    - name: "会议论文集"
      url: "/conferences/"
      weight: 5
    - name: "关于"
      url: "/about/"
      weight: 6
    - name: "资源"
      url: "/links/"
      weight: 7

params:
  env: production
  title: "语音/音乐/音频论文速递"
  analytics:
    google:
      SiteVerificationTag: "SndYtZUZX0x7oCnlQPrNzYeB6Z6zeytsVL9BBargMwI"
  description: "每日 AI 自动生成的语音/AI 领域论文深度分析"
  keywords: [语音, 音频, AI, 论文, arxiv, speech, audio]
  DateFormat: "2006-01-02"

  defaultTheme: "auto"
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowLastMod: true
  ShowToc: true
  TocOpen: false
  comments: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 20
    # taxonomyAliases 由经典搜索在载入快照后按页注入（概念 zh/en + aliases + 祖先链）
    keys: ["title", "titleZh", "originalTitle", "summary", "tags", "task", "method", "categories", "arxivId", "taxonomyAliases"]

  mainSections: [posts]

  homeInfoParams:
    Title: "📄 语音/音乐/音频论文速递"
    Content: "每日自动抓取 arxiv/huggingface 最新语音/音乐/音频AI 论文，AI 深度分析后发布"

  assets:
    disableFingerprinting: false
    favicon: "og-default.png"
    favicon16x16: "og-default.png"
    favicon32x32: "og-default.png"
    apple_touch_icon: "og-default.png"
    safari_pinned_tab: "og-default.png"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInPage: false

  label:
    text: "语音/音乐/音频论文速递"

  # 统计配置（去 https://goatcounter.com 注册后填入）
  # goatcounter: your-code
  # umami:
  #   scriptUrl: https://your-umami.com/script.js
  #   websiteId: your-website-id

  footer:
    text: "AI 辅助导读 · 论文结论请以原文为准"

  archive:
    dateFormat: "2006-01-02"
    groupByDate: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML

services:
  rss:
    limit: 50

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
          inline:
            - - \(
              - \)
    renderer:
      unsafe: true
  highlight:
    noClasses: false
