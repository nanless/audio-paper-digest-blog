baseURL: "https://nanless.github.io/audio-paper-digest-blog/"
languageCode: "zh-cn"
title: "语音/音频论文速递"
theme: "PaperMod"

paginate: 20
enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false

minify:
  disableXML: true

menu:
  main:
    - name: "搜索"
      url: "/search/"
      weight: 0
    - name: "归档"
      url: "/archives/"
      weight: 1
    - name: "标签"
      url: "/tags/"
      weight: 2
    - name: "分类"
      url: "/categories/"
      weight: 3
    - name: "会议论文集"
      url: "/conferences/"
      weight: 4

params:
  env: production
  title: "语音/音频论文速递"
  description: "每日 AI 自动生成的语音/AI 领域论文深度分析"
  keywords: [语音, 音频, AI, 论文, arxiv, speech, audio]
  DateFormat: "2006-01-02"

  defaultTheme: "auto"
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowToc: true
  TocOpen: false
  comments: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary"]

  homeInfoParams:
    Title: "📄 语音/音频论文速递"
    Content: "每日自动抓取 arxiv/huggingface 最新语音/音频AI 论文，AI 深度分析后发布"

  assets:
    disableFingerprinting: true

  cover:
    hidden: false
    hiddenInList: false
    hiddenInPage: false

  label:
    text: "语音/音频论文速递"

  # 统计配置（去 https://goatcounter.com 注册后填入）
  # goatcounter: your-code
  # umami:
  #   scriptUrl: https://your-umami.com/script.js
  #   websiteId: your-website-id

  footer:
    Content: "由 AI 自动生成 · Paper Digest"

  archive:
    dateFormat: "2006-01-02"
    groupByDate: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
          inline:
            - - \(
              - \)
    renderer:
      unsafe: true
  highlight:
    noClasses: false
