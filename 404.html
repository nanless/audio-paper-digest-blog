<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>正在跳转到新地址 · Audio Research Portal</title>
  <script>
    (function () {
      var targetOrigin = "https://nanless.github.io/audio-research-portal/";
      var subpath = (window.location.pathname || "")
        .replace(/^\/audio-paper-digest-blog(?:\/|$)/i, "")
        .replace(/^\/+/, "");
      var target = targetOrigin + subpath + (window.location.search || "") + (window.location.hash || "");
      window.__portalRedirectTarget = target;
      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://nanless.github.io/audio-research-portal/">
  </noscript>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1f2937; }
    a { color: #2563eb; word-break: break-all; }
    .hint { color: #6b7280; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>页面已迁移至新地址</h1>
  <p>正在自动跳转到 <a id="redirect-link" href="https://nanless.github.io/audio-research-portal/">https://nanless.github.io/audio-research-portal/</a> ……</p>
  <p class="hint">This page has moved to Audio Research Portal. If you are not redirected automatically, click the link above.</p>
  <script>
    (function () {
      var el = document.getElementById("redirect-link");
      if (el && window.__portalRedirectTarget) {
        el.href = window.__portalRedirectTarget;
        el.textContent = window.__portalRedirectTarget;
      }
    })();
  </script>
</body>
</html>
