<section class="paper-tools share-tools" aria-label="分享文章" data-share-url="{{ .Permalink }}" data-share-title="{{ .Title | plainify }}">
  <div class="paper-tools__heading">
    <h2>分享这篇文章</h2>
    <p>把有用的研究留给自己，或分享给同事</p>
  </div>
  <div class="paper-tools__actions">
    <button class="paper-tool share-tools__copy" type="button" hidden>复制文章链接</button>
    <button class="paper-tool share-tools__native" type="button" hidden>系统分享</button>
  </div>
  <textarea class="paper-tools__copy-fallback share-tools__link" aria-label="文章链接，可手动复制" rows="3" readonly hidden>{{ .Permalink }}</textarea>
  <p class="paper-tools__status" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><p class="paper-tools__identifier">请复制文章链接：<a href="{{ .Permalink }}">{{ .Permalink }}</a></p></noscript>
</section>
{{- $script := resources.Get "js/share-tools.js" | js.Build | minify | fingerprint -}}
<script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" crossorigin="anonymous"></script>
