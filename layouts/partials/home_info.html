{{- with site.Params.homeInfoParams }}
<section class="research-home-hero" aria-labelledby="research-home-title">
  <div>
    <div class="rw-eyebrow">Audio Research Intelligence</div>
    <h1 id="research-home-title">把每日论文变成可检索的研究信号</h1>
    <p class="research-home-hero__lead">面向中文语音、音乐与音频研究者：从最新论文中快速看见任务、方法、关键结果、复现资源与明确局限。</p>
    <div class="research-home-hero__actions">
      <a class="rw-action rw-action--primary" href="{{ "papers/" | absURL }}">进入论文库</a>
      <a class="rw-action" href="{{ "search/" | absURL }}">搜索论文</a>
      <a class="rw-action" href="{{ "index.xml" | absURL }}">RSS 订阅</a>
    </div>
  </div>
  <aside class="research-home-hero__panel" aria-label="研究快捷入口">
    <div>
      <div class="research-home-hero__status">持续更新</div>
      <strong>研究快捷入口</strong>
      <p>从任务和会议切入，比在时间流里逐页翻找更高效。</p>
    </div>
    <div class="research-shortcuts">
      <a class="research-shortcut" href="{{ "tags/语音识别/" | absURL }}">语音识别<span>ASR · 低资源 · 多语言</span></a>
      <a class="research-shortcut" href="{{ "tags/语音合成/" | absURL }}">语音合成<span>TTS · 音色 · 流式生成</span></a>
      <a class="research-shortcut" href="{{ "tags/音频生成/" | absURL }}">音频与音乐生成<span>扩散 · 流匹配 · 多模态</span></a>
      <a class="research-shortcut" href="{{ "conferences/" | absURL }}">会议论文集<span>ICASSP · ICLR · ICML</span></a>
    </div>
  </aside>
</section>
{{- end }}
