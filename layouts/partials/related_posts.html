{{- $candidates := where site.RegularPages "Params.paper_digest_page_type" "paper" }}
{{- $related := $candidates.Related . | first 3 }}
{{- with $related }}
<section class="related-posts research-related" aria-labelledby="related-papers-title">
  <div class="rw-eyebrow">Keep Exploring</div>
  <h2 id="related-papers-title">相关论文</h2>
  <div class="research-related__grid">
    {{- range . }}
    <a class="research-related__card" href="{{ .Permalink }}">
      <strong>{{ .Title }}</strong>
      {{- with .Description }}<span>{{ . | markdownify | plainify }}</span>{{ end }}
    </a>
    {{- end }}
  </div>
</section>
{{- end }}
